name: Multi Env Pipeline

on:
  push:
    branches:
      - develop
      - staging
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Test"

  deploy-dev:
    needs: test
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: dev

  deploy-staging:
    needs: test
    if: github.ref_name == 'staging'
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: staging

  deploy-prod:
    needs: test
    if: github.ref_name == 'main'
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: prod